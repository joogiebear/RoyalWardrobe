# RoyalWardrobe - player-facing text.
#
# Every message is optional: delete a line and the wording shipped with the plugin is used instead.
# Empty a message ("") to silence it. Colour codes use '&'.

prefix: "&6Wardrobe &8» &r"

equipped: "&aEquipped that setup."
stored: "&aStored your current setup."
unequipped: "&aUnequipped your setup."

no-armor: "&cYou aren't wearing any armor to store."
already-active: "&cYou're already wearing a saved setup — unequip it first."
slot-locked: "&cThat wardrobe slot is locked. Unlock more with a rank or perk."
inventory-full: "&cMake room in your inventory first."
# Per-profile wardrobes only: the player has no active profile right now.
no-profile: "&cJoin or create a profile before using your wardrobe."
slot-corrupt: "&cThat wardrobe slot is damaged and can't be used — tell an admin."

renamed: "&aSetup renamed."
nothing-to-rename: "&cStore a setup there first, then name it."

# /wardrobe equip <number> refusals.
no-such-slot: "&cNo wardrobe slot with that number."
already-wearing: "&eYou're already wearing that setup."
setup-empty: "&cThat setup is empty."

# Shown when a wardrobe write fails: the set on screen is not what is stored.
save-failed: "&cYour wardrobe could not be saved — tell an admin before changing more sets."
# The wardrobe stays locked while a failed write is retried, and unlocks once it saves.
save-pending: "&cYour last wardrobe change isn't saved yet. The wardrobe stays locked until it is."
save-recovered: "&aYour wardrobe has been saved and can be used again."

# Shown when the wardrobe can't be read (database down, for instance).
load-failed: "&cYour wardrobe couldn't be loaded right now. Try again shortly."
# Servers sharing one database: the server the player came from hasn't finished saving their wardrobe.
load-busy: "&eYour wardrobe is still being saved on another server. Try again in a moment."
# Servers sharing one database: another server changed this wardrobe, so the change here wasn't saved over it.
changed-elsewhere: "&cYour wardrobe was changed on another server, so that change wasn't saved. Open it again to see the current sets."

# The dialog used to name a setup. The first prompt line is the title; any others show under it.
input:
  confirm: "&aDone"
  cancel: "&cCancel"
  rename:
    - "&fName this setup"
    - "&7Leave it blank to cancel."

# /wardrobe command output. These are sent without the prefix.
# {label} is the command as typed (wardrobe, or an alias).
command:
  no-permission: "&cYou don't have permission to use the wardrobe."
  reload-no-permission: "&cYou don't have permission to do that."
  reloaded: "&aRoyalWardrobe config, messages, menu and scope reloaded. &7Storage settings apply on restart."
  players-only: "&cOnly players can open the wardrobe."
  usage-equip: "&cUsage: /{label} equip <number> &7— see /{label} list"

# /wardrobe list, sent without the prefix. One line per set:
#   {number} the slot number, {name} the set's name, {state} one of the states below.
list:
  header: "&6&lWardrobe &7— /wardrobe equip <number>"
  line: "&e{number}. &f{name} {state}"
  state:
    wearing: "&a(wearing)"
    damaged: "&4(damaged — ask an admin)"
    locked: "&c(locked)"
    empty: "&8(empty)"
    # A stored set: {pieces} lists its armor, e.g. "Diamond Helmet, Iron Boots".
    pieces: "&7{pieces}"
