# RoyalWardrobe main configuration.
# The menu layout, icons and sounds are in gui/wardrobe.yml. Reload both with /wardrobe reload.

storage:
  # SQLITE (no setup, single server) or MYSQL (fill in the block below; use it for a network).
  # Storage settings apply on restart.
  type: SQLITE
  sqlite-file: "wardrobe.db"
  mysql:
    host: localhost
    port: 3306
    database: royalwardrobe
    username: root
    password: ""
    properties: "useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    pool-size: 10

# How many wardrobe slots a player may use. Slots past their allowance show as locked.
# Grant more with permissions; the highest number a player holds wins:
#   royalwardrobe.slots.3     -> 3 slots
#   royalwardrobe.slots.*     -> the maximum below
# Gear in a locked slot can still be taken out, but nothing can be stored or equipped there.
slots:
  default: 1
  permission: royalwardrobe.slots
  # Hard ceiling. Also bounded by the number of set slots in gui/wardrobe.yml.
  max: 18

wardrobe:
  # If this placeholder resolves (RoyalSkyblock + PlaceholderAPI), each profile gets its own
  # wardrobe; otherwise it's one per player. Blank it to force per-player.
  # In per-profile mode a player with no active profile can't open the wardrobe.
  scope-placeholder: "%royalskyblock_profile_id%"

# Chat feedback lives in messages.yml; menu text (buttons, lore) lives in gui/wardrobe.yml.

