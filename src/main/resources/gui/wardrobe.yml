# RoyalWardrobe menu. The layout is fixed at 6 rows:
#   rows 1-4: each column is an armor set (helmet, chestplate, leggings, boots)
#   row 5:    a control dye under each column (store, equip, or unequip the active set)
#   row 6:    navigation
#
# Item syntax: <material> [hide_attributes] name:"&a..."
# Placeholders in dye names and lore: %number% %set_name% %pieces% %first_worn%
# (%set_name% is the name given with right-click rename, or default-name below.)

title: "&8Wardrobe &7(%page%/%pages%)"

# Sets per page (1-9) and number of pages. 9 x 2 = 18 sets.
columns-per-page: 9
pages: 2

# Date shown for a saved set (the day you first wore it).
date-format: "MMM d, yyyy"
never-worn: "&7—"

# Name of a set nobody has renamed (%number% is its slot). Also used by /wardrobe list.
default-name: "Setup #%number%"
# %pieces% for a set with no armor in it.
no-pieces: "empty"

# Sound names: BLOCK_CHEST_OPEN style or a namespaced key (minecraft:block.chest.open).
sounds:
  open:
    enabled: true
    name: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.2
  equip:
    enabled: true
    name: ITEM_ARMOR_EQUIP_DIAMOND
    volume: 0.8
    pitch: 1.0
  store:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.8
    pitch: 1.2
  unequip:
    enabled: true
    name: ITEM_ARMOR_EQUIP_LEATHER
    volume: 0.8
    pitch: 1.0
  fail:
    enabled: true
    name: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 1.0

# Shown where a set has no piece.
empty-slot:
  item: 'light_gray_stained_glass_pane name:" "'

# Shown for slots the player hasn't unlocked (see 'slots' in config.yml).
locked-slot:
  item: 'red_stained_glass_pane name:"&c&lLocked"'

# A slot whose stored set could not be read back. It can't be used until an admin recovers it
# (the console logs which).
corrupt-slot:
  item: 'black_stained_glass_pane name:"&4Damaged"'

dye:
  store:
    item: 'gray_dye name:"&7&lStore Current Setup"'
    lore:
      - "&7This slot is empty."
      - ""
      - "&7Wear an armor set, then click to"
      - "&7store it here as setup &f#%number%&7."
      - ""
      - "&eClick to store your current armor"
  equip:
    item: 'pink_dye name:"&d&l%set_name%"'
    lore:
      - "&7Pieces: &f%pieces%"
      - "&7First worn: &f%first_worn%"
      - ""
      - "&eClick to equip &7(swaps with what you're wearing)"
      - "&8Right-click to rename"
  locked:
    item: 'barrier name:"&c&lLocked Slot #%number%"'
    lore:
      - "&7You haven't unlocked this wardrobe slot."
      - ""
      - "&7Unlock more slots with a rank or perk."
  corrupt:
    item: 'structure_void name:"&4&lDamaged Slot #%number%"'
    lore:
      - "&7This setup couldn't be read back."
      - ""
      - "&7Tell an admin — it has been left"
      - "&7untouched so it can be recovered."
  unequip:
    item: 'lime_dye name:"&a&lActive: %set_name%"'
    lore:
      - "&7This is the setup you're wearing."
      - "&7First worn: &f%first_worn%"
      - "&8Right-click to rename"
      - ""
      - "&eClick to unequip"

# Bottom navigation. Buttons are placed by row/column (1-indexed) or a raw 'slot:' index.
# A 'left-click:' list replaces a button's built-in behaviour:
#   left-click:
#     - id: play_sound
#       args: {sound: UI_BUTTON_CLICK, volume: 0.7, pitch: 1.2}
#     - id: close
nav:
  filler: 'gray_stained_glass_pane name:" "'
  previous:
    item: 'arrow name:"&e&lPrevious Page"'
    row: 6
    column: 1
  next:
    item: 'arrow name:"&e&lNext Page"'
    row: 6
    column: 9
  close:
    item: 'barrier name:"&cClose"'
    row: 6
    column: 5

# Extra buttons, drawn after the navigation. Click ids:
#   close (or close_inventory), message, player_command, console_command, play_sound
#
# Example: a button that sends the player to spawn.
#
# buttons:
#   - item: 'ender_pearl name:"&bSpawn"'
#     lore:
#       - "&7Return to spawn."
#     row: 6
#     column: 3
#     left-click:
#       - id: player_command
#         args: {command: "spawn"}
#       - id: close
buttons: []
